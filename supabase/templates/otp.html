<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#F5F5F3;font-family:-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;color:#141414">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F5F3;padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border:1px solid #EAEAE5;border-radius:18px;padding:32px">
            <tr>
              <td>
                <div style="display:inline-block;width:32px;height:32px;line-height:32px;text-align:center;border-radius:10px;background:#141414;color:#FFFFFF;font-weight:700;font-size:14px">H</div>
                <h1 style="margin:24px 0 8px;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.3px">Your Hisab sign-in code</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#6B6B66">Enter this code in the app to sign in. It expires in 1 hour.</p>
                <div style="font-size:34px;font-weight:700;letter-spacing:10px;font-family:'SF Mono',Menlo,Consolas,monospace;background:#F1F1EE;border-radius:14px;padding:18px 0;text-align:center">{{ .Token }}</div>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#A3A39E">If you didn’t try to sign in, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
