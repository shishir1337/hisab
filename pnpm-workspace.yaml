# React Native tooling (Metro, autolinking, NativeWind babel) expects hoisted node_modules.
nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
# React Native 0.86's renderer requires this exact React; Next.js 16 accepts it too.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  '@types/react': ~19.2.2
